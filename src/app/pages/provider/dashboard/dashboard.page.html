<ion-header [translucent]="true">
  <ion-toolbar>
    <div slot="start" class="menu-logo">
      <ion-title>Event Plaza</ion-title>
    </div>
    <div slot="end" class="notification">
      <ion-select [(ngModel)]="selectedCity" placeholder="Select City">
        <ion-select-option *ngFor="let city of cities" [value]="city">
          {{ city }}
        </ion-select-option>
      </ion-select>
      <ion-icon name="notifications"></ion-icon>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col>
        <ion-item lines="none">
          <ion-icon name="home"></ion-icon>
          <ion-label>
            <p>My Listings</p>
            <ion-note>3 active listings</ion-note>
          </ion-label>
        </ion-item>
      </ion-col>
      <ion-col>
        <ion-item Lines="none">
          <ion-icon name="calendar"></ion-icon>
          <ion-label>
            <p>Bookings</p>
            <ion-note>2 Upcoming inds</ion-note>
          </ion-label>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-item lines="none">
          <ion-icon name="construct"></ion-icon>
          <ion-label>
            <p>Services Offered</p>
            <ion-note>2 Services</ion-note>
          </ion-label>
        </ion-item>
      </ion-col>
      <ion-col>
        <ion-item Lines="none">
          <ion-icon name="chatbox-ellipses"></ion-icon>
          <ion-label>
            <p>Messages</p>
            <ion-note>1 New message</ion-note>
          </ion-label>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="invert-row">
      <ion-col>
        <ion-item lines="none">
          <ion-icon name="add-outline"></ion-icon>
          <ion-label>
            <p>Add New Listing</p>
          </ion-label>
        </ion-item>
      </ion-col>
      <ion-col>
        <ion-item lines="none">
          <ion-icon name="today-outline"></ion-icon>
          <ion-label>
            <p>Update Availability</p>
          </ion-label>
        </ion-item>
      </ion-col>
    </ion-row>
    <h4 class="label">Upcoming Booking</h4>
    <ion-grid class="card-grid">
      <ion-row>
        <ion-icon name="bag-handle-outline"></ion-icon>
        <h5>Arjun Weds Priya</h5>
      </ion-row>
      <p>Jul 20,2025.4:30 PM</p>
      <p class="mrgnT5">Grand Palace</p>
    </ion-grid>
  </ion-grid>
</ion-content>
